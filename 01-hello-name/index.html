<!-- ================================================================
     ACTIVITY 1 · "Hello, _____!"  👋
     ----------------------------------------------------------------
     GOAL: Get a name from the page and show a friendly greeting.
     This is often the very first program a web developer writes!
     ================================================================ -->

<h1 class="title">Hello, <span id="name-placeholder">______</span>! 👋</h1>

<p class="instructions">Type your name below, then press the button.</p>

<div class="controls">
  <input id="name-input" type="text" placeholder="Type your name here..." />
  <button id="greet-button">Say Hello!</button>
</div>

<p id="greeting" class="greeting"></p>
